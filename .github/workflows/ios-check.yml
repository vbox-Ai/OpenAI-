name: iOS 编译检查

# 阶段 0：验证 Rust 核心能否为 aarch64-apple-ios 编译（cargo check）。
# 阶段 1.7：升级为 cargo build（真实代码生成 + 链接，产出静态库）。
# 完整 iOS 产物（.app/.ipa）需要 Flutter 工程，属于后续阶段。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 编译检查（宿主桌面，验证 bin + lib 仍可编）
        run: cargo check --workspace

      - name: 真实构建（iOS arm64，产出静态库）
        run: cargo build --target aarch64-apple-ios --workspace
